<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Radio Luce</title><style>body{background:#06152f;color:white;font-family:Arial;text-align:center;margin:0}.c{max-width:700px;margin:30px auto;background:#0b2348;padding:25px;border:1px solid #c6a64b;border-radius:18px}h1{color:#f1d36a}button,input{font-size:18px;padding:14px;margin:8px;border:0;border-radius:12px}button{font-weight:bold}.red{background:#d92d20;color:white}.gold{background:#e2bd4f}.blue{background:#17345f;color:white}meter{width:90%}</style><div class=c><h1>🎙 RADIO LUCE</h1><p>LA VOCE DELLA SPERANZA · SOLDATI DI CRISTO</p><div id=login><input id=pin type=password inputmode=numeric placeholder="PIN"><br><button class=gold id=enter>ENTRA NELLO STUDIO</button></div><div id=studio hidden><h2>Studio Radio Luce</h2><p id=status>Pronto</p><button class=blue id=mic>🎤 ATTIVA MICROFONO</button><br><meter id=level min=0 max=1 value=0></meter><br><button class=red id=go disabled>🔴 VAI IN DIRETTA</button><button class=blue id=stop disabled>⏹ TERMINA DIRETTA</button><p><small>Lascia la pagina aperta e lo schermo attivo durante la diretta.</small></p></div></div><script>
const H="https://radio-luce-live-bridge.onrender.com/health",W="wss://radio-luce-live-bridge.onrender.com/live";let pin="",s,ws,mr;
const $=x=>document.getElementById(x);enter.onclick=()=>{pin=$("pin").value.trim();if(pin){login.hidden=true;studio.hidden=false}};
mic.onclick=async()=>{try{s=await navigator.mediaDevices.getUserMedia({audio:true});status.textContent="Microfono attivo";go.disabled=false;let c=new(AudioContext||webkitAudioContext)(),a=c.createAnalyser();c.createMediaStreamSource(s).connect(a);let d=new Uint8Array(a.fftSize);(function f(){a.getByteTimeDomainData(d);let q=0;for(let x of d){let v=(x-128)/128;q+=v*v}level.value=Math.min(1,Math.sqrt(q/d.length)*4);requestAnimationFrame(f)})()}catch(e){status.textContent="Errore microfono: "+e.message}};
function mt(){for(let x of["audio/webm;codecs=opus","audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm"])if(MediaRecorder.isTypeSupported(x))return x;return""}
go.onclick=async()=>{go.disabled=true;status.textContent="Avvio server...";try{await fetch(H,{cache:"no-store"})}catch{}status.textContent="Collegamento alla diretta...";ws=new WebSocket(W+"?pin="+encodeURIComponent(pin));let t=setTimeout(()=>{status.textContent="Server non risponde";go.disabled=false;try{ws.close()}catch{}},65000);ws.onopen=()=>{clearTimeout(t);ws.send(JSON.stringify({type:"start",mime:mt()}))};ws.onmessage=e=>{try{if(JSON.parse(e.data).type==="ready"){let m=mt();mr=new MediaRecorder(s,m?{mimeType:m}:{});mr.ondataavailable=e=>{if(e.data.size&&ws.readyState===1)ws.send(e.data)};mr.start(750);status.textContent="🔴 IN DIRETTA";stop.disabled=false}}catch{}};ws.onclose=e=>{if(mr&&mr.state!=="inactive")mr.stop();go.disabled=false;stop.disabled=true;if(e.code!==1000)status.textContent="Rete interrotta: "+(e.reason||"controlla il collegamento")};ws.onerror=()=>status.textContent="Errore collegamento Live Bridge"};
stop.onclick=()=>{if(mr&&mr.state!=="inactive")mr.stop();if(ws)ws.close(1000,"fine diretta");status.textContent="Diretta terminata";go.disabled=false;stop.disabled=true};</script></html>
